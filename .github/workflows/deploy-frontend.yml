name: Deploy Frontend to S3

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Pas de --content-type forcé : le type MIME est déduit de l'extension (.html, .css, .js).
      # Forcer text/html ferait ignorer les feuilles de style et les scripts par le navigateur.
      - name: Sync to S3
        run: aws s3 sync frontend/ s3://${{ secrets.S3_BUCKET }} --delete